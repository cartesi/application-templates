name: Build
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
concurrency: ${{ github.workflow }}-${{ github.ref }}
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template:
          - cpp
          - cpp-low-level
          - go
          - java
          - javascript
          - lua
          - php
          - python
          - ruby
          - rust
          - typescript
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: current

      - name: Install Cartesi CLI
        run: npm install -g @cartesi/cli@2.0.0-alpha.16

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Check system requirements
        run: cartesi doctor

      - name: Build ${{ matrix.template }}
        run: cartesi build
        working-directory: ${{ matrix.template }}

      - name: Print cartesi-machine hash
        run: cartesi hash
        working-directory: ${{ matrix.template }}

      - name: Upload root.ext2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.template }}-root.ext2
          path: ${{ matrix.template }}/.cartesi/root.ext2

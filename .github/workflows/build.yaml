name: Build
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
concurrency: ${{ github.workflow }}-${{ github.ref }}
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template:
          - cpp
          - cpp-low-level
          - go
          - java
          - javascript
          - lua
          - python
          - ruby
          - rust
          - typescript
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.5

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: current

      - name: Install Cartesi CLI
        run: npm install -g @cartesi/cli@2.0.0-alpha.34

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Check system requirements
        run: cartesi doctor

      - name: Build ${{ matrix.template }}
        run: cartesi build --verbose
        working-directory: ${{ matrix.template }}

      - name: Print cartesi-machine hash
        run: cartesi hash
        working-directory: ${{ matrix.template }}

      - name: Upload root.ext2 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.template }}-rootfs
          path: |
            ${{ matrix.template }}/.cartesi/root.ext2
            ${{ matrix.template }}/.cartesi/root.tar

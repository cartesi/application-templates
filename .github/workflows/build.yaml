name: Build
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
  packages: write
concurrency: ${{ github.workflow }}-${{ github.ref }}
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template:
          - cpp
          - cpp-low-level
          - go
          - java
          - javascript
          - lua
          - python
          - ruby
          - rust
          - typescript
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: current

      - name: Install Cartesi CLI
        run: npm install -g @cartesi/cli@2.0.0-alpha.43

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check system requirements
        run: cartesi doctor

      - name: Build ${{ matrix.template }}
        # Reads main's cache plus this build's own tag, and writes only its own
        # tag: <template> on main, <template>-pr-<number> on pull requests.
        run: >-
          cartesi build --verbose
          --cache-from type=registry,ref=${CACHE_IMAGE}:${{ matrix.template }}
          --cache-from type=registry,ref=${CACHE_IMAGE}:${CACHE_TAG}
          --cache-to type=registry,ref=${CACHE_IMAGE}:${CACHE_TAG},mode=max,ignore-error=true
        env:
          CACHE_IMAGE: ghcr.io/${{ github.repository }}-cache
          CACHE_TAG: ${{ github.event.pull_request.number && format('{0}-pr-{1}', matrix.template, github.event.pull_request.number) || matrix.template }}
        working-directory: ${{ matrix.template }}

      - name: Print cartesi-machine hash
        run: cartesi hash
        working-directory: ${{ matrix.template }}

      - name: Upload root.ext2 artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.template }}-rootfs
          path: |
            ${{ matrix.template }}/.cartesi/root.ext2
            ${{ matrix.template }}/.cartesi/root.tar
